<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Dashboard de Temperatura e Umidade</title>
</head>

<body>
    <div class="graficos">

        <div class="grafico-tamanho">
            <h2>Temperatura e Umidade por Horário</h2>
            <canvas id="grafico_linha"></canvas>
        </div>

        <div class="grafico-tamanho">
            <h2>Médias Mensais de Temperatura e Umidade</h2>
            <canvas id="grafico_barra"></canvas>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        const ctx = document.getElementById('grafico_linha');

        new Chart(ctx, {
            type: 'line',

            data: {
                labels: ['12:00', '13:00', '14:00', '15:00', '16:00', '17:00'],

                datasets: [
                    {
                        label: 'Temperatura',
                        data: [30, 29, 28, 25, 22, 23],
                        borderColor: '#820AD1',
                        backgroundColor: '#820AD1'
                    },
                    {
                        label: 'Umidade',
                        data: [80, 82, 80, 85, 80, 83],
                        borderColor: '#FF7A00',
                        backgroundColor: '#FF7A00'
                    }
                ]
            },

            options: {
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });

        const ctxBarra = document.getElementById('grafico_barra');

        new Chart(ctxBarra, {
            type: 'bar',

            data: {
                labels: ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho'],

                datasets: [
                    {
                        label: 'Temperatura Média',
                        data: [22, 24, 27, 23, 20, 18],
                        backgroundColor: '#3B82F6'
                    },
                    {
                        label: 'Umidade Média',
                        data: [90, 89, 93, 87, 88, 82],
                        backgroundColor: '#EC4899'
                    }
                ]
            },

            options: {
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
    </script>
</body>
</html>
